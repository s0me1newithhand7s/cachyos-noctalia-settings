[bar."default"]
start = [
    "launcher",
    "clock",
    "spacer_1",
    "group:g1"
]

center = [
    "workspaces",
    "spacer_1",
    "active_window"
]

end = [
    "media",
    "spacer_1",
    "tray",
    "notifications",
    "network",
    "volume",
    "session"
]

concave_edge_corners = true
